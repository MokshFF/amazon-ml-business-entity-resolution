# Amazon ML Challenge 2026 - Business Entity Resolution Configuration
# Team: Moksh & Dhwaj (Team Leader) [50/50 Technical Ownership]

project:
  name: "amazon-ml-business-entity-resolution"
  random_seed: 42
  log_level: "INFO"

# File Paths (relative to repository root; configurable without hardcoded machine paths)
paths:
  dataset_dir: "dataset"
  train:
    source1: "dataset/train/train_source1.tsv"
    source2: "dataset/train/train_source2.tsv"
    source3: "dataset/train/train_source3.tsv"
    ground_truth: "dataset/train/train_ground_truth.tsv"
  test:
    source1: "dataset/test/test_source1.tsv"
    source2: "dataset/test/test_source2.tsv"
    source3: "dataset/test/test_source3.tsv"
  output:
    output_dir: "output"
    candidate_pairs: "output/candidate_pairs.tsv"
    matching_results: "output/matching_results.tsv"
    checkpoints_dir: "output/checkpoints"

# Memory and Data Processing Parameters
processing:
  chunk_size: 50000            # Process ~2.5 GB data in manageable streaming chunks
  n_jobs: -1                   # CPU parallel workers (-1 utilizes all available cores)
  use_sparse_tfidf: true       # Use scipy sparse matrices to prevent RAM overflow

# Blocking Parameters
blocking:
  max_candidates_per_entity: 50
  strategy_a:                  # Lead: Moksh
    enabled: true
    token_inverted_index: true
    char_prefix_length: 3
  strategy_b:                  # Lead: Dhwaj [Team Leader]
    enabled: true
    country_partition: true
    address_token_index: true

# Feature Engineering Settings
features:
  name_metrics:                # Lead: Moksh
    - "levenshtein"
    - "token_sort_ratio"
    - "token_set_ratio"
    - "jaro_winkler"
    - "token_jaccard"
  address_metrics:             # Lead: Dhwaj [Team Leader]
    - "token_set_ratio"
    - "token_jaccard"
    - "country_exact_match"
    - "is_source3"
    - "is_addr_missing"

# Model Selection & Training Settings
model:
  experiment_a:                # Lead: Moksh
    type: "logistic_regression"
    class_weight: "balanced"
    max_iter: 1000
  experiment_b:                # Lead: Dhwaj [Team Leader]
    type: "random_forest"
    n_estimators: 100
  negatives_per_positive: 5     # Hard negative sampling ratio from blocking pool

# Validation & Evaluation Parameters
validation:
  val_split_ratio: 0.2         # Holdout split ratio for internal validation
  metric: "f05"                # Precision-heavy competition metric
  threshold_sweep:             # Sweep range for tuning decision boundary
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
    - 0.85
    - 0.90
    - 0.95
